<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doubly Linked List Visualizer</title>
<style>
:root{--bg:#f4f6fa;--sf:#fff;--tx:#1a2033;--mu:#5b647a;--bd:#d9deea;--ac:#4f46e5;--nx:#2563eb;--pv:#ea580c;--gd:#16a34a;--bad:#dc2626;--wn:#ca8a04;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1219;--sf:#181c27;--tx:#e8ebf5;--mu:#9aa3bd;--bd:#2b3248;--ac:#8b93ff;--nx:#60a5fa;--pv:#fb923c;--gd:#4ade80;--bad:#f87171;--wn:#facc15}}
:root[data-theme="dark"]{--bg:#0f1219;--sf:#181c27;--tx:#e8ebf5;--mu:#9aa3bd;--bd:#2b3248;--ac:#8b93ff;--nx:#60a5fa;--pv:#fb923c;--gd:#4ade80;--bad:#f87171;--wn:#facc15}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
select,input[type=text],input[type=number]{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
input[type=text],input[type=number]{width:110px}
button{font:inherit;padding:7px 13px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#msg{color:var(--bad);min-height:20px;margin:8px 0 0;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
#stage{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
svg text{font-family:"Segoe UI",system-ui,sans-serif}
.nd{fill:var(--sf);stroke:var(--bd);stroke-width:2}
.nd.new{stroke:var(--gd);stroke-width:3}.nd.del{stroke:var(--bad);stroke-width:3}.nd.found{stroke:var(--wn);stroke-width:3}
.ar{fill:none;stroke-width:2}
#expl{margin:12px 0;padding:10px 12px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;min-height:64px}
code{font-family:Consolas,"Courier New",monospace;background:var(--bd);padding:1px 5px;border-radius:4px;font-size:.92em}
.pl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pl input[type=range]{flex:1;min-width:120px}
#cnt{color:var(--mu);font-size:13px;min-width:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{font:13px Consolas,"Courier New",monospace;border:1px solid var(--bd);border-radius:999px;padding:2px 10px}
#out{margin:0;background:#0f1220;color:#a7f3d0;border-radius:8px;padding:10px;font:13px/1.45 Consolas,"Courier New",monospace;min-height:56px;max-height:130px;overflow:auto;white-space:pre-wrap}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#stack{font-size:13px;color:var(--mu);margin-bottom:8px}
#code{position:relative;background:#0f1220;color:#e6e9f5;border-radius:8px;padding:8px 0;max-height:520px;overflow:auto;font:13px/1.55 Consolas,"Courier New",monospace}
.ln{display:flex;white-space:pre;padding-right:12px}.ln .no{width:34px;text-align:right;color:#6b7394;padding-right:12px;flex:none}
.ln.cur{background:#2d3475;box-shadow:inset 3px 0 0 #facc15}
@media(prefers-reduced-motion:no-preference){.ln{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
<h1>Doubly linked list visualizer</h1>
<p class="sub">Pick an operation, press Run, then step through the C++ code line by line.</p>
<section class="card">
<div class="ctl">
<label>Data type<select id="type"><option>int</option><option>double</option><option>string</option><option>Student</option></select></label>
<label>Operation<select id="op"></select></label>
<label id="gV">Value<input type="text" id="vIn"></label>
<label id="gN">Name<input type="text" id="nameIn"></label>
<label id="gR">Roll no.<input type="number" id="rollIn"></label>
<label id="gP">Position<input type="number" id="posIn" value="2" min="1"></label>
<button class="pri" id="run">Run</button>
<button id="reset">Reset list</button>
</div>
<p id="msg" role="status"></p>
</section>
<div class="grid">
<section class="card">
<div id="stage"><svg id="svg" role="img" aria-label="Linked list diagram"></svg></div>
<div id="expl" aria-live="polite"></div>
<div class="pl">
<button id="first" title="First step">⏮</button><button id="prev">◀ Prev</button><button id="play">▶ Play</button><button id="next">Next ▶</button><button id="last" title="Last step">⏭</button>
<input type="range" id="scrub" min="0" max="0" value="0" aria-label="Step">
<span id="cnt"></span>
<label style="font-size:12px;color:var(--mu)">Speed <input type="range" id="spd" min="1" max="5" value="3"></label>
</div>
<div class="chips" id="state"></div>
<pre id="out"></pre>
</section>
<section class="card">
<div class="tabs"><button id="tFn" class="on">Running function</button><button id="tCl">Node and class</button></div>
<div id="stack"></div>
<div id="code"></div>
</section>
</div>
</div>
<script>
/* ===================== ENGINE (pure logic, no DOM) ===================== */
var UID = 0;
var MAX_NODES = 8;
function clone(o) { return JSON.parse(JSON.stringify(o)); }

var CODE_SRC = {
insertAtFront:
`void insertAtFront(T value) {                     //#sig
    Node<T>* newNode = new Node<T>(value);        //#new

    if (head == nullptr) {                        //#if
        head = newNode;                           //#h1
        tail = newNode;                           //#t1
    } else {
        newNode->next = head;                     //#nn
        head->prev = newNode;                     //#hp
        head = newNode;                           //#h2
    }
    count++;                                      //#cnt
}                                                 //#end`,

insertAtEnd:
`void insertAtEnd(T value) {                       //#sig
    Node<T>* newNode = new Node<T>(value);        //#new

    if (head == nullptr) {                        //#if
        head = newNode;                           //#h1
        tail = newNode;                           //#t1
    } else {
        tail->next = newNode;                     //#tn
        newNode->prev = tail;                     //#np
        tail = newNode;                           //#t2
    }
    count++;                                      //#cnt
}                                                 //#end`,

insertAtPosition:
`void insertAtPosition(T value, int position) {    //#sig
    if (position < 1 || position > count + 1) {   //#chk
        cout << "Invalid position" << endl;       //#bad
        return;                                   //#ret0
    }
    if (position == 1) {                          //#p1
        insertAtFront(value);                     //#callF
        return;                                   //#retF
    }
    if (position == count + 1) {                  //#pe
        insertAtEnd(value);                       //#callE
        return;                                   //#retE
    }

    Node<T>* current = head;                      //#cur
    for (int i = 1; i < position - 1; i++) {      //#for
        current = current->next;                  //#adv
    }

    Node<T>* newNode = new Node<T>(value);        //#new
    newNode->next = current->next;                //#nn
    newNode->prev = current;                      //#np
    current->next->prev = newNode;                //#nx
    current->next = newNode;                      //#cn
    count++;                                      //#cnt
}                                                 //#end`,

deleteFront:
`void deleteFront() {                              //#sig
    if (head == nullptr) {                        //#if
        cout << "List is empty" << endl;          //#msg
        return;                                   //#ret0
    }

    Node<T>* temp = head;                         //#tmp
    head = head->next;                            //#hd

    if (head == nullptr) {                        //#if2
        tail = nullptr;                           //#t0
    } else {
        head->prev = nullptr;                     //#hp
    }

    delete temp;                                  //#del
    count--;                                      //#cnt
}                                                 //#end`,

deleteEnd:
`void deleteEnd() {                                //#sig
    if (head == nullptr) {                        //#if
        cout << "List is empty" << endl;          //#msg
        return;                                   //#ret0
    }

    Node<T>* temp = tail;                         //#tmp
    tail = tail->prev;                            //#tl

    if (tail == nullptr) {                        //#if2
        head = nullptr;                           //#h0
    } else {
        tail->next = nullptr;                     //#tn
    }

    delete temp;                                  //#del
    count--;                                      //#cnt
}                                                 //#end`,

deleteByValue:
`void deleteByValue(T value) {                     //#sig
    Node<T>* current = head;                      //#cur
    while (current != nullptr &&
           current->data != value) {              //#while
        current = current->next;                  //#adv
    }

    if (current == nullptr) {                     //#if
        cout << "Value not found" << endl;        //#nf
        return;                                   //#ret0
    }

    if (current == head) {                        //#ifH
        deleteFront();                            //#callF
        return;                                   //#retF
    }
    if (current == tail) {                        //#ifT
        deleteEnd();                              //#callE
        return;                                   //#retE
    }

    current->prev->next = current->next;          //#l1
    current->next->prev = current->prev;          //#l2
    delete current;                               //#del
    count--;                                      //#cnt
}                                                 //#end`,

search:
`int search(T value) {                             //#sig
    Node<T>* current = head;                      //#cur
    int position = 1;                             //#pos

    while (current != nullptr) {                  //#while
        if (current->data == value) {             //#if
            return position;                      //#ret
        }
        current = current->next;                  //#adv
        position++;                               //#inc
    }
    return -1;                                    //#ret2
}                                                 //#end`,

displayForward:
`void displayForward() {                           //#sig
    Node<T>* current = head;                      //#cur
    cout << "NULL <-> ";                          //#c1
    while (current != nullptr) {                  //#while
        cout << current->data << " <-> ";         //#print
        current = current->next;                  //#adv
    }
    cout << "NULL" << endl;                       //#c2
}                                                 //#end`,

displayBackward:
`void displayBackward() {                          //#sig
    Node<T>* current = tail;                      //#cur
    cout << "NULL <-> ";                          //#c1
    while (current != nullptr) {                  //#while
        cout << current->data << " <-> ";         //#print
        current = current->prev;                  //#adv
    }
    cout << "NULL" << endl;                       //#c2
}                                                 //#end`,

reverse:
`void reverse() {                                  //#sig
    Node<T>* current = head;                      //#cur
    while (current != nullptr) {                  //#while
        Node<T>* temp = current->prev;            //#tmp
        current->prev = current->next;            //#sw1
        current->next = temp;                     //#sw2
        current = current->prev;                  //#adv
    }

    Node<T>* temp = head;                         //#t3
    head = tail;                                  //#h3
    tail = temp;                                  //#t4
}                                                 //#end`
};

var STATIC_SRC = {
nodeStruct:
`template <typename T>
struct Node {
    T        data;       // the value, any type
    Node<T>* prev;       // address of the previous node
    Node<T>* next;       // address of the next node

    Node(T value) {
        data = value;
        prev = nullptr;
        next = nullptr;
    }
};`,
listClass:
`template <typename T>
class DoublyLinkedList {
private:
    Node<T>* head;       // first node
    Node<T>* tail;       // last node
    int      count;      // number of nodes

public:
    DoublyLinkedList() {
        head  = nullptr;
        tail  = nullptr;
        count = 0;
    }

    // insertAtFront, insertAtEnd, insertAtPosition,
    // deleteFront, deleteEnd, deleteByValue,
    // search, displayForward, displayBackward, reverse
};`
};

var CODE = {};
Object.keys(CODE_SRC).forEach(function (name) {
  var ids = {};
  var lines = CODE_SRC[name].split("\n").map(function (ln, i) {
    var m = ln.match(/\s*\/\/#(\w+)\s*$/);
    if (m) { ids[m[1]] = i; return ln.slice(0, m.index); }
    return ln;
  });
  CODE[name] = { name: name, lines: lines, ids: ids, isStatic: false };
});
Object.keys(STATIC_SRC).forEach(function (name) {
  CODE[name] = { name: name, lines: STATIC_SRC[name].split("\n"), ids: {}, isStatic: true };
});

/* ---------- values ---------- */
var SAMPLES = {
  int: [10, 20, 30],
  double: [1.5, 2.5, 3.5],
  string: ["Ali", "Sara", "Hina"],
  Student: [{ name: "Ayesha", roll: 101 }, { name: "Bilal", roll: 102 }]
};
function mkVal(type, inp) {
  if (type === "int") { var n = parseInt(inp, 10); return { label: String(n), sub: "", key: n }; }
  if (type === "double") { var d = parseFloat(inp); return { label: Number.isInteger(d) ? d.toFixed(1) : String(d), sub: "", key: d }; }
  if (type === "string") { return { label: String(inp), sub: "", key: String(inp) }; }
  return { label: String(inp.name), sub: "#" + inp.roll, key: parseInt(inp.roll, 10) };
}
function emptyState() {
  return { nodes: {}, row: [], head: null, tail: null, count: 0, vars: {}, nums: {}, hl: {},
           floating: null, slot: 0, out: [], line: "" };
}
function makeBase(type, vals) {
  var s = emptyState();
  (vals || SAMPLES[type]).forEach(function (v) {
    var id = ++UID;
    s.nodes[id] = { id: id, val: mkVal(type, v), prev: null, next: null };
    if (s.tail !== null) { s.nodes[s.tail].next = id; s.nodes[id].prev = s.tail; }
    else s.head = id;
    s.tail = id; s.row.push(id); s.count++;
  });
  return s;
}
function cleanSnap(snap) {
  var s = clone(snap);
  s.vars = {}; s.nums = {}; s.hl = {}; s.floating = null; s.slot = 0; s.line = "";
  return s;
}
function lab(s, id) { return id === null || id === undefined ? "nullptr" : s.nodes[id].val.label; }

/* ---------- recorder ---------- */
function Rec(base) { this.s = clone(base); this.frames = []; this.stack = []; }
Rec.prototype.enter = function (fn, owned) { this.stack.push({ fn: fn, owned: owned || [] }); };
Rec.prototype.step = function (id, text, mut) {
  if (mut) mut(this.s);
  var fn = this.stack[this.stack.length - 1].fn;
  var line = CODE[fn].ids[id];
  if (line === undefined) throw new Error("bad line id " + fn + ":" + id);
  this.frames.push({ fn: fn, line: line, text: text,
    stack: this.stack.map(function (x) { return x.fn; }), snap: clone(this.s) });
};
Rec.prototype._cleanup = function (s) {
  var top = this.stack[this.stack.length - 1];
  top.owned.forEach(function (n) { delete s.vars[n]; delete s.nums[n]; });
  if (this.stack.length === 1) s.hl = {};
};
Rec.prototype.exit = function (text) {   // normal end: closing brace
  var self = this;
  this.step("end", text || "The function ends. Its local variables disappear.", function (s) { self._cleanup(s); });
  this.stack.pop();
};
Rec.prototype.leave = function (id, text, mut) {   // early return
  var self = this;
  this.step(id, text, function (s) { if (mut) mut(s); self._cleanup(s); });
  this.stack.pop();
};

function pushOut(s, str) { s.out.push(str); }
function newNodeStep(R, id, val, slot, extra) {
  R.step("new", "Create a new node on the heap that stores `" + val.label + "`. Both its prev and next start as nullptr.", function (s) {
    s.nodes[id] = { id: id, val: val, prev: null, next: null };
    s.floating = id; s.slot = slot; s.vars.newNode = id; s.hl[id] = "new";
  });
}

var OPS = {};

OPS.insertAtFront = function (R, a) {
  var val = a.val, id = ++UID;
  R.enter("insertAtFront", ["newNode"]);
  newNodeStep(R, id, val, 0);
  var empty = R.s.head === null;
  R.step("if", empty ? "`head == nullptr` is true, so the list is empty." : "`head == nullptr` is false, so the list already has nodes.");
  if (empty) {
    R.step("h1", "The new node is the only node, so head points to it.", function (s) { s.head = id; });
    R.step("t1", "tail points to it as well. The node joins the list.", function (s) { s.tail = id; s.row.unshift(id); s.floating = null; });
  } else {
    var old = R.s.head;
    R.step("nn", "`newNode->next = head`: the new node's next pointer aims at the old first node (`" + lab(R.s, old) + "`).", function (s) { s.nodes[id].next = old; });
    R.step("hp", "`head->prev = newNode`: the old first node's prev pointer aims back at the new node. The two nodes are now linked both ways.", function (s) { s.nodes[old].prev = id; });
    R.step("h2", "`head = newNode`: head moves to the new node, so it becomes the first node.", function (s) { s.head = id; s.row.unshift(id); s.floating = null; });
  }
  R.step("cnt", "`count++`: the list now holds " + (R.s.count + 1) + " node" + (R.s.count + 1 === 1 ? "" : "s") + ".", function (s) { s.count++; });
  R.exit();
};

OPS.insertAtEnd = function (R, a) {
  var val = a.val, id = ++UID;
  R.enter("insertAtEnd", ["newNode"]);
  newNodeStep(R, id, val, R.s.row.length);
  var empty = R.s.head === null;
  R.step("if", empty ? "`head == nullptr` is true, so the list is empty." : "`head == nullptr` is false, so the list already has nodes.");
  if (empty) {
    R.step("h1", "The new node is the only node, so head points to it.", function (s) { s.head = id; });
    R.step("t1", "tail points to it as well. The node joins the list.", function (s) { s.tail = id; s.row.push(id); s.floating = null; });
  } else {
    var old = R.s.tail;
    R.step("tn", "`tail->next = newNode`: the old last node's next pointer aims at the new node.", function (s) { s.nodes[old].next = id; });
    R.step("np", "`newNode->prev = tail`: the new node's prev pointer aims back at the old last node. Both links exist now.", function (s) { s.nodes[id].prev = old; });
    R.step("t2", "`tail = newNode`: tail moves to the new node, so it becomes the last node.", function (s) { s.tail = id; s.row.push(id); s.floating = null; });
  }
  R.step("cnt", "`count++`: the list now holds " + (R.s.count + 1) + " node" + (R.s.count + 1 === 1 ? "" : "s") + ".", function (s) { s.count++; });
  R.exit();
};

OPS.insertAtPosition = function (R, a) {
  var val = a.val, pos = a.pos;
  R.enter("insertAtPosition", ["current", "newNode"]);
  var valid = pos >= 1 && pos <= R.s.count + 1;
  R.step("chk", valid ? "Is `" + pos + "` a valid position? It must be between 1 and `count + 1` = " + (R.s.count + 1) + ". Yes, it is." :
                        "Is `" + pos + "` a valid position? It must be between 1 and `count + 1` = " + (R.s.count + 1) + ". No, it is not.");
  if (!valid) {
    R.step("bad", "Print an error message, because the position does not exist.", function (s) { pushOut(s, "Invalid position"); });
    R.leave("ret0", "`return`: nothing is inserted and the list stays the same.");
    return;
  }
  R.step("p1", pos === 1 ? "`position == 1` is true: inserting at position 1 is the same as inserting at the front." : "`position == 1` is false.");
  if (pos === 1) {
    R.step("callF", "Call `insertAtFront(value)` and let it do the work.");
    OPS.insertAtFront(R, a);
    R.leave("retF", "Back in `insertAtPosition`. `return` finishes the job.");
    return;
  }
  R.step("pe", pos === R.s.count + 1 ? "`position == count + 1` is true: inserting just after the last node is the same as inserting at the end." : "`position == count + 1` is false, so the new node goes somewhere in the middle.");
  if (pos === R.s.count + 1) {
    R.step("callE", "Call `insertAtEnd(value)` and let it do the work.");
    OPS.insertAtEnd(R, a);
    R.leave("retE", "Back in `insertAtPosition`. `return` finishes the job.");
    return;
  }
  R.step("cur", "`current = head`: start walking from the first node.", function (s) { s.vars.current = s.head; });
  var i = 1;
  while (true) {
    var cond = i < pos - 1;
    var ii = i;
    R.step("for", (ii === 1 ? "The loop starts with `i = 1`. " : "`i++` makes `i = " + ii + "`. ") + "Is `" + ii + " < " + (pos - 1) + "`? " + (cond ? "Yes, so keep walking." : "No, so stop. `current` is the node just before position " + pos + "."),
           function (s) { s.nums.i = ii; });
    if (!cond) break;
    R.step("adv", "`current = current->next`: move one node to the right.", function (s) { s.vars.current = s.nodes[s.vars.current].next; });
    i++;
  }
  var cur = R.s.vars.current, id = ++UID;
  newNodeStep(R, id, val, pos - 1);
  R.step("nn", "`newNode->next = current->next`: the new node aims forward at the node after current (`" + lab(R.s, R.s.nodes[cur].next) + "`).", function (s) { s.nodes[id].next = s.nodes[cur].next; });
  R.step("np", "`newNode->prev = current`: the new node aims back at current (`" + lab(R.s, cur) + "`).", function (s) { s.nodes[id].prev = cur; });
  R.step("nx", "`current->next->prev = newNode`: the node after current now aims back at the new node.", function (s) { s.nodes[s.nodes[cur].next].prev = id; });
  R.step("cn", "`current->next = newNode`: current aims forward at the new node. All four links are done, so the node is inserted.", function (s) { s.nodes[cur].next = id; s.row.splice(pos - 1, 0, id); s.floating = null; });
  R.step("cnt", "`count++`: the list now holds " + (R.s.count + 1) + " nodes.", function (s) { s.count++; });
  R.exit();
};

function removeNode(s, id) {
  delete s.nodes[id];
  s.row = s.row.filter(function (x) { return x !== id; });
  delete s.hl[id];
  Object.keys(s.vars).forEach(function (k) { if (s.vars[k] === id) delete s.vars[k]; });
}

OPS.deleteFront = function (R) {
  R.enter("deleteFront", ["temp"]);
  var empty = R.s.head === null;
  R.step("if", empty ? "`head == nullptr` is true, so there is nothing to delete." : "`head == nullptr` is false, so there is a first node to delete.");
  if (empty) {
    R.step("msg", "Print a message instead of deleting.", function (s) { pushOut(s, "List is empty"); });

$("first").onclick = function () { stop(); go(0); }; $("last").onclick = function () { stop(); go(1e9); };
$("prev").onclick = function () { stop(); go(idx - 1); }; $("next").onclick = function () { stop(); go(idx + 1); };
$("play").onclick = play; $("scrub").oninput = function () { stop(); go(+this.value); };
$("spd").oninput = function () { if (timer) { stop(); play(); } };
$("tFn").onclick = function () { tab = "fn"; render(); }; $("tCl").onclick = function () { tab = "cl"; render(); };
document.addEventListener("keydown", function (e) {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== "range") return;
  if (e.key === "ArrowRight") { stop(); go(idx + 1); } else if (e.key === "ArrowLeft") { stop(); go(idx - 1); }
});
$("vIn").addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
setType();
</script>
